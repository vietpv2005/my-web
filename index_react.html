<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quản lý người dùng - React CRUD</title>

  <!-- React, ReactDOM và Babel theo tài liệu hướng dẫn -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 28px;
      font-family: Arial, sans-serif;
      color: #222;
      background: #f4f6f9;
    }
    .app {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px;
      background: #fff;
      border: 1px solid #d7dee8;
      border-radius: 8px;
      box-shadow: 0 3px 14px rgba(0,0,0,.06);
    }
    h1 { margin: 0 0 22px; color: #1f3556; }
    .toolbar {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .search-input {
      width: min(360px, 100%);
      padding: 10px 12px;
      border: 1px solid #cbd3df;
      border-radius: 5px;
      font-size: 14px;
    }
    button {
      border: 0;
      border-radius: 5px;
      padding: 8px 12px;
      cursor: pointer;
      font-size: 13px;
    }
    button:disabled { opacity: .6; cursor: not-allowed; }
    .btn-add { background: #1769aa; color: white; padding: 10px 16px; }
    .btn-edit { background: #e6a23c; color: #222; margin-right: 6px; }
    .btn-delete { background: #d9534f; color: white; }
    .btn-save { background: #198754; color: white; }
    .btn-cancel { background: #e4e7ec; color: #222; margin-left: 8px; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 900px; }
    th, td {
      border: 1px solid #dce2e9;
      padding: 10px 9px;
      text-align: left;
      font-size: 13px;
    }
    th { background: #edf2f7; color: #26384f; }
    tbody tr:nth-child(even) { background: #fafbfd; }
    .status { padding: 18px; text-align: center; color: #5b6573; }
    .error { color: #b42318; }
    .modal-overlay {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, .45);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      z-index: 999;
    }
    .modal-content {
      background: #fff;
      padding: 22px;
      border-radius: 8px;
      width: min(560px, 100%);
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 8px 30px rgba(0,0,0,.2);
    }
    .modal-content h2 { margin: 0 0 18px; color: #1f3556; }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .form-field { display: flex; flex-direction: column; gap: 5px; }
    .form-field.full { grid-column: 1 / -1; }
    .form-field label { font-size: 13px; font-weight: 600; }
    .form-field input {
      width: 100%;
      padding: 9px 10px;
      border: 1px solid #cbd3df;
      border-radius: 5px;
      font-size: 14px;
    }
    .modal-actions { margin-top: 18px; text-align: right; }
    .counter { color: #687385; font-size: 13px; }
    @media (max-width: 600px) {
      body { padding: 10px; }
      .app { padding: 15px; }
      .form-grid { grid-template-columns: 1fr; }
      .form-field.full { grid-column: auto; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const EMPTY_USER = {
      name: "",
      username: "",
      email: "",
      address: { street: "", suite: "", city: "" },
      phone: "",
      website: ""
    };

    // Component tìm kiếm: truyền từ component con lên App thông qua callback.
    function SearchForm({ onChangeValue }) {
      return (
        <input
          className="search-input"
          type="text"
          placeholder="Tìm theo name hoặc username..."
          onChange={(e) => onChangeValue(e.target.value)}
        />
      );
    }

    // Component thêm người dùng.
    function AddUser({ onAdd }) {
      const [adding, setAdding] = useState(false);
      const [user, setUser] = useState({ ...EMPTY_USER, address: { ...EMPTY_USER.address } });

      const handleChange = (e) => {
        const { id, value } = e.target;

        // Với các trường thuộc address, cần copy cả object address.
        if (["street", "suite", "city"].includes(id)) {
          setUser((prev) => ({
            ...prev,
            address: { ...prev.address, [id]: value }
          }));
        } else {
          setUser((prev) => ({ ...prev, [id]: value }));
        }
      };

      const handleAdd = (e) => {
        e.preventDefault();

        if (!user.name.trim() || !user.username.trim()) {
          alert("Vui lòng nhập Name và Username!");
          return;
        }

        onAdd({ ...user, address: { ...user.address } });
        setUser({ ...EMPTY_USER, address: { ...EMPTY_USER.address } });
        setAdding(false);
      };

      return (
        <>
          <button className="btn-add" onClick={() => setAdding(true)}>Thêm người dùng</button>

          {adding && (
            <div className="modal-overlay" onMouseDown={(e) => {
              if (e.target === e.currentTarget) setAdding(false);
            }}>
              <div className="modal-content">
                <h2>Thêm người dùng</h2>
                <form onSubmit={handleAdd}>
                  <UserFields user={user} onChange={handleChange} />
                  <div className="modal-actions">
                    <button type="submit" className="btn-save">Thêm</button>
                    <button type="button" className="btn-cancel" onClick={() => setAdding(false)}>Hủy</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </>
      );
    }

    // Dùng chung các trường nhập liệu cho form Thêm và Sửa.
    function UserFields({ user, onChange }) {
      return (
        <div className="form-grid">
          <div className="form-field">
            <label htmlFor="name">Name *</label>
            <input id="name" value={user.name} onChange={onChange} required />
          </div>
          <div className="form-field">
            <label htmlFor="username">Username *</label>
            <input id="username" value={user.username} onChange={onChange} required />
          </div>
          <div className="form-field">
            <label htmlFor="email">Email</label>
            <input id="email" type="email" value={user.email || ""} onChange={onChange} />
          </div>
          <div className="form-field">
            <label htmlFor="phone">Phone</label>
            <input id="phone" value={user.phone || ""} onChange={onChange} />
          </div>
          <div className="form-field">
            <label htmlFor="street">Street</label>
            <input id="street" value={user.address?.street || ""} onChange={onChange} />
          </div>
          <div className="form-field">
            <label htmlFor="suite">Suite</label>
            <input id="suite" value={user.address?.suite || ""} onChange={onChange} />
          </div>
          <div className="form-field">
            <label htmlFor="city">City</label>
            <input id="city" value={user.address?.city || ""} onChange={onChange} />
          </div>
          <div className="form-field">
            <label htmlFor="website">Website</label>
            <input id="website" value={user.website || ""} onChange={onChange} />
          </div>
        </div>
      );
    }

    // Bảng kết quả: đọc API và thực hiện Read, Update, Delete.
    function ResultTable({ keyword, user, onAdded }) {
      const [users, setUsers] = useState([]);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState("");
      const [editing, setEditing] = useState(null);

      // Chỉ gọi API một lần khi ResultTable được mount.
      useEffect(() => {
        fetch("https://jsonplaceholder.typicode.com/users")
          .then((res) => {
            if (!res.ok) throw new Error("Không thể tải dữ liệu từ API.");
            return res.json();
          })
          .then((data) => {
            setUsers(data);
            setLoading(false);
          })
          .catch((err) => {
            setError(err.message || "Đã xảy ra lỗi khi tải dữ liệu.");
            setLoading(false);
          });
      }, []);

      // Khi App truyền user mới xuống, thêm user vào state của bảng.
      useEffect(() => {
        if (user) {
          setUsers((prev) => {
            const nextId = prev.length ? Math.max(...prev.map((item) => Number(item.id) || 0)) + 1 : 1;
            return [...prev, { ...user, id: nextId, address: { ...user.address } }];
          });
          onAdded();
        }
      }, [user, onAdded]);

      const filteredUsers = users.filter((u) => {
        const searchText = keyword.toLowerCase().trim();
        return (
          (u.name || "").toLowerCase().includes(searchText) ||
          (u.username || "").toLowerCase().includes(searchText)
        );
      });

      // Deep copy user và address để form sửa không làm thay đổi dữ liệu gốc.
      const editUser = (selectedUser) => {
        setEditing({
          ...selectedUser,
          address: { ...(selectedUser.address || {}) }
        });
      };

      const handleEditChange = (e) => {
        const { id, value } = e.target;

        if (["street", "suite", "city"].includes(id)) {
          setEditing((prev) => ({
            ...prev,
            address: { ...prev.address, [id]: value }
          }));
        } else {
          setEditing((prev) => ({ ...prev, [id]: value }));
        }
      };

      const saveUser = (e) => {
        e.preventDefault();

        if (!editing.name.trim() || !editing.username.trim()) {
          alert("Vui lòng nhập Name và Username!");
          return;
        }

        setUsers((prev) => prev.map((u) => u.id === editing.id ? editing : u));
        setEditing(null);
      };

      // Tạo mảng mới, không sửa trực tiếp state hiện tại.
      const removeUser = (id) => {
        setUsers((prev) => prev.filter((u) => u.id !== id));
      };

      if (loading) return <div className="status">Đang tải danh sách người dùng...</div>;
      if (error) return <div className="status error">{error}</div>;

      return (
        <>
          <div className="counter">Tìm thấy {filteredUsers.length} / {users.length} người dùng</div>
          <div className="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Họ tên</th>
                  <th>Username</th>
                  <th>Email</th>
                  <th>Địa chỉ</th>
                  <th>Số điện thoại</th>
                  <th>Thao tác</th>
                </tr>
              </thead>
              <tbody>
                {filteredUsers.length === 0 ? (
                  <tr><td colSpan="7" className="status">Không tìm thấy người dùng phù hợp.</td></tr>
                ) : (
                  filteredUsers.map((u) => (
                    <tr key={u.id}>
                      <td>{u.id}</td>
                      <td>{u.name}</td>
                      <td>{u.username}</td>
                      <td>{u.email}</td>
                      <td>
                        {u.address?.street || ""}{u.address?.suite ? `, ${u.address.suite}` : ""}
                        {u.address?.city ? `, ${u.address.city}` : ""}
                      </td>
                      <td>{u.phone}</td>
                      <td>
                        <button className="btn-edit" onClick={() => editUser(u)}>Sửa</button>
                        <button className="btn-delete" onClick={() => removeUser(u.id)}>Xóa</button>
                      </td>
                    </tr>
                  ))
                )}
              </tbody>
            </table>
          </div>

          {editing && (
            <div className="modal-overlay" onMouseDown={(e) => {
              if (e.target === e.currentTarget) setEditing(null);
            }}>
              <div className="modal-content">
                <h2>Sửa thông tin người dùng</h2>
                <form onSubmit={saveUser}>
                  <UserFields user={editing} onChange={handleEditChange} />
                  <div className="modal-actions">
                    <button type="submit" className="btn-save">Lưu thay đổi</button>
                    <button type="button" className="btn-cancel" onClick={() => setEditing(null)}>Hủy</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </>
      );
    }

    // Component cha quản lý state dùng chung và truyền props xuống component con.
    function App() {
      const [kw, setKeyword] = useState("");
      const [newUser, setNewUser] = useState(null);

      return (
        <div className="app">
          <h1>Quản lý người dùng</h1>
          <div className="toolbar">
            <SearchForm onChangeValue={setKeyword} />
            <AddUser onAdd={setNewUser} />
          </div>
          <ResultTable
            keyword={kw}
            user={newUser}
            onAdded={() => setNewUser(null)}
          />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
